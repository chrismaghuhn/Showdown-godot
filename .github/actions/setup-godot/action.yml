name: Setup Godot
description: Downloads Godot (and optionally its export templates), caches them and sets $GODOT.

inputs:
  version:
    description: Godot version without suffix, e.g. 4.7.2
    required: true
  templates:
    description: Also install export templates (~1.3 GB, cached)
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot-dist
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable"
        mkdir -p ~/godot-dist
        curl -fsSL -o /tmp/godot.zip "$base/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-dist
        if [ "${{ inputs.templates }}" = "true" ]; then
          curl -fsSL -o ~/godot-dist/templates.tpz "$base/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        fi

    - name: Install Godot
      shell: bash
      run: |
        set -euo pipefail
        echo "GODOT=$HOME/godot-dist/Godot_v${{ inputs.version }}-stable_linux.x86_64" >> "$GITHUB_ENV"
        if [ "${{ inputs.templates }}" = "true" ]; then
          dest="$HOME/.local/share/godot/export_templates/${{ inputs.version }}.stable"
          mkdir -p "$dest"
          unzip -q -o ~/godot-dist/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$dest/"
        fi
